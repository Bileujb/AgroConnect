spring.application.name=agroconnect-api
server.port=${PORT:8080}
# backend/.env usa o formato CHAVE=valor, sem aspas. Credenciais nunca vão no app.
spring.config.import=optional:file:./.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.initialization-fail-timeout=10000
spring.sql.init.mode=never
supabase.url=${SUPABASE_URL:https://seu-projeto.supabase.co}
supabase.key=${SUPABASE_PUBLISHABLE_KEY:}
app.cors-origins=${CORS_ORIGINS:http://localhost:8081,http://localhost:19006,http://localhost:8080}
app.auth-redirect-url=${AUTH_REDIRECT_URL:http://localhost:8080/recuperar-senha.html}
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.deserialization.fail-on-unknown-properties=true
logging.level.org.springframework.web.client=INFO
